<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تحكم لعبة الشاحنة</title>
    <style>
        body {
            background-color: #1a1a1a;
            color: #white;
            font-family: Arial, sans-serif;
            text-align: center;
            margin: 0;
            padding: 20px;
        }
        h1 {
            color: #ffcc00;
        }
        .controller {
            display: grid;
            grid-template-columns: repeat(3, 100px);
            grid-gap: 15px;
            justify-content: center;
            margin-top: 50px;
        }
        button {
            background-color: #333;
            color: white;
            border: 2px solid #ffcc00;
            padding: 20px;
            font-size: 18px;
            border-radius: 10px;
            cursor: pointer;
            touch-action: manipulation;
        }
        button:active {
            background-color: #ffcc00;
            color: black;
        }
        .empty {
            border: none;
            background: none;
            cursor: default;
        }
        #status {
            margin-top: 20px;
            font-size: 18px;
            color: #00ffcc;
        }
    </style>
</head>
<body>

    <h1>لوحة تحكم الشاحنة</h1>
    <p>استخدم الأزرار أدناه لإرسال أوامر التحكم</p>

    <div class="controller">
        <div class="empty"></div>
        <button onclick="sendCommand('تقدم للأمام')">⬆️<br>تقدم</button>
        <div class="empty"></div>
        
        <button onclick="sendCommand('انعطاف لليسار')">⬅️<br>يسار</button>
        <button onclick="sendCommand('فرامل / توقف')">🛑<br>توقف</button>
        <button onclick="sendCommand('انعطاف لليمين')">➡️<br>يمين</button>
        
        <div class="empty"></div>
        <button onclick="sendCommand('رجوع للخلف')">⬇️<br>رجوع</button>
        <div class="empty"></div>
    </div>

    <div id="status">الحالة: جاهز</div>

    <script>
        function command(text) {
            document.getElementById('status').innerText = "الحالة: " + text;
            console.log("تم تنفيذ الأمر: " + text);
        }
    </script>

</body>
</html>
